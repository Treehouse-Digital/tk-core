---
name: Auto Release
#
# Automatically create a release commit from the latest version in CHANGELOG.md
#
# This release commit should live by itself and not part of any branch since it contains
# release-specific changes.
#

'on':
  push:
    branches: [master]

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release_vars:
    name: Setup Release Variables
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.vars.outputs.name }}
      name_sed_escaped: ${{ steps.vars.outputs.name_sed_escaped }}
    steps:
      - uses: actions/checkout@v6
      - name: Check for new version from CHANGELOG.md
        id: changelog_tag
        shell: bash
        run: |
          set -eu -o pipefail

          TAG="$(grep -m 1 -oP '(?<=^## \[)(?!Unreleased)[^\]]+' CHANGELOG.md)"
          NEW_VERSION=""

          if gh release view "$TAG" &> /dev/null
          then
            echo "::warning title=CHANGELOG::Release already exists for $TAG, skipping creation."

          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" &> /dev/null
          then
            echo "::warning title=CHANGELOG::Tag $TAG already exists, skipping creation."

          else
            NEW_VERSION="$TAG"
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup variables
        id: vars
        shell: bash
        env:
          NEW_CHANGELOG_VERSION: ${{ steps.changelog_tag.outputs.new_version }}
        run: |
          set -eu -o pipefail

          RELEASE_NAME=""

          flush_step_output() {
            RELEASE_NAME_ESCAPED="$(sed -e 's/[][\\/.*^$]/\\&/g' <<< "$RELEASE_NAME")"

            echo "name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
            echo "name_sed_escaped=$RELEASE_NAME_ESCAPED" >> "$GITHUB_OUTPUT"

            tee -a "$GITHUB_STEP_SUMMARY" << EOF
          Results      | Values
          -------------|----------------
          Release Name | '$RELEASE_NAME'
          (sed escaped)| '$RELEASE_NAME_ESCAPED'
          EOF
          }

          if [ -n "$NEW_CHANGELOG_VERSION" ]
          then
            RELEASE_NAME="$NEW_CHANGELOG_VERSION"

          else
            echo "::warning title=Release Creation::No new version from CHANGELOG.md; skipping release creation."
            flush_step_output
            exit 0
          fi

          RELEASE_NAME="$(xargs <<< "$RELEASE_NAME")" # Trim leading and trailing whitespace

          if [ -z "$RELEASE_NAME" ]
          then
            echo "::error title=Release Name::Must not be empty after trimming whitespace."
            exit 1
          fi

          if [[ "$RELEASE_NAME" =~ .*[^a-zA-Z0-9._-] ]]
          then
            echo "::error title=Release Name::May only contain letters, numbers, '.', '_' and '-': '$RELEASE_NAME'"
            exit 1
          fi

          flush_step_output

  release:
    name: GitHub Release
    needs: release_vars
    if: needs.release_vars.outputs.name != ''
    runs-on: ubuntu-latest
    env:
      RELEASE_NAME: "${{ needs.release_vars.outputs.name }}"
      RELEASE_NAME_ESCAPED: "${{ needs.release_vars.outputs.name_sed_escaped }}"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Modify setup.py
        shell: bash
        run: |
          set -eu -o pipefail

          # sed expression to replace contents inside setup(...) call
          PIP_COMPATIBLE_VERSION="${RELEASE_NAME/-/+}""

          VERSION_REPO='
          /^setup\(\s*$/,/^\)\s*$/ {
            s/^(\s*version=)get_version\(\)/\1"'$PIP_COMPATIBLE_VERSION'"/
            s:shotgunsoftware/tk-core:${{ github.repository }}:
          }
          '
          sed -i -E "$VERSION_REPO" setup.py

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git commit -am "Modified for releasing ${{ env.RELEASE_NAME }}"
          git tag "${{ env.RELEASE_NAME }}"
          git push origin "${{ env.RELEASE_NAME }}"

      - name: Create release from tag
        shell: bash
        run: |
          set -eu -o pipefail
          sed -n \
            -e '/^## \[${{ env.RELEASE_NAME_ESCAPED }}] /,/^## \[/ {/^## \[/d; p}' \
            -e '/^\[[^]]*]: /p' \
            CHANGELOG.md \
          | gh release create "$RELEASE_NAME" \
            --latest \
            --title="$RELEASE_NAME" \
            --notes-file=-
          gh release view "$RELEASE_NAME" | tee -a "$GITHUB_STEP_SUMMARY"
